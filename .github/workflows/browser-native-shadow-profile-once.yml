name: Owned native shadow profile once

on:
  push:
    branches:
      - codex/webgpu-readiness-audit
    paths:
      - .github/diagnostic-requests/owned-native-shadow-profile-20261007.json

permissions:
  contents: read
  actions: read

concurrency:
  group: owned-native-shadow-profile-${{ github.sha }}
  cancel-in-progress: false

jobs:
  profile:
    name: Profile the exact pending shadow compiler once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the immutable trigger commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/BrowserSmoke/package-lock.json

      # This push is inactive until a separate record names its exact commit and
      # run ID. The activation file does not trigger another diagnostic run.
      - name: Admit this run and verify both published shadow bundles
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node Tools/BrowserSmoke/prepare-owned-native-profile.mjs

      - name: Install the approved pinned browser tooling
        run: |
          npm ci --prefix Tools/BrowserSmoke
          cd Tools/BrowserSmoke
          npx playwright install --with-deps chromium

      - name: Inspect installed collector prerequisites without profiling
        run: node Tools/BrowserSmoke/native-profile-prerequisites.mjs "$RUNNER_TEMP/shadow-profile-prerequisites.json"

      - name: Run the approved single shadow compiler diagnostic
        timeout-minutes: 6
        env:
          DEBUG: ''
          NODE_OPTIONS: ''
          XRE_OWNED_PROFILE_ACTIVATION_FILE: ${{ steps.prepare.outputs.activation_file }}
          XRE_OWNED_PROFILE_GAME_PUBLISH: ${{ steps.prepare.outputs.game_publish }}
          XRE_OWNED_PROFILE_BASELINE_PUBLISH: ${{ steps.prepare.outputs.baseline_publish }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Build/_AgentValidation/00000000-000000-shared/owned-native-shadow-profile-once/report"
          node Tools/BrowserSmoke/run.mjs \
            --game-only --game-kind advanced-shadow-parity \
            --game-publish "$XRE_OWNED_PROFILE_GAME_PUBLISH" \
            --baseline-publish "$XRE_OWNED_PROFILE_BASELINE_PUBLISH" \
            --gpu-mode software --native-owned-shadow-profile-once \
            --output "$GITHUB_WORKSPACE/Build/_AgentValidation/00000000-000000-shared/owned-native-shadow-profile-once/report" \
            > /dev/null 2>&1

      - name: Admit only the reviewed sanitized summary
        id: sanitize
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          XRE_OWNED_PROFILE_ACTIVATION_FILE: ${{ steps.prepare.outputs.activation_file }}
        run: node Tools/BrowserSmoke/sanitize-owned-native-profile.mjs

      - name: Preserve only the sanitized code-region summary
        if: ${{ always() && steps.sanitize.outputs.upload_allowed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: owned-native-shadow-profile-once-summary
          path: Build/_AgentValidation/00000000-000000-shared/owned-native-shadow-profile-once/report/owned-native-profile-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove owned preparation and diagnostic files
        if: always()
        env:
          XRE_OWNED_PROFILE_PRIVATE_ROOT: ${{ steps.prepare.outputs.private_root }}
        run: |
          node --input-type=module -e '
            import { promises as fs } from "node:fs";
            import path from "node:path";
            const root = process.env.XRE_OWNED_PROFILE_PRIVATE_ROOT;
            if (root) {
              const temp = await fs.realpath(process.env.RUNNER_TEMP);
              if (path.dirname(root) !== temp || !/^owned-native-profile-[A-Za-z0-9]{6}$/.test(path.basename(root)))
                throw new Error("Preparation path is outside the owned runner directory.");
              await fs.rm(root, { recursive: true, force: true });
              try { await fs.lstat(root); throw new Error("Preparation cleanup did not finish."); }
              catch (error) { if (error.code !== "ENOENT") throw error; }
            }
            await fs.rm(path.join(process.env.RUNNER_TEMP, "shadow-profile-prerequisites.json"), { force: true });
            const report = path.join(process.env.GITHUB_WORKSPACE,
              "Build/_AgentValidation/00000000-000000-shared/owned-native-shadow-profile-once/report");
            await fs.rm(report, { recursive: true, force: true });
          '
