name: Portable browser build and publish

on:
  push:
    branches:
      - master
      - codex/webgpu-readiness-audit
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  MSBUILDDISABLENODEREUSE: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  VALIDATION_ROOT: Build/_AgentValidation/00000000-000000-shared/browser-ci

jobs:
  compile:
    name: Compile portable projects and publish the browser host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Set up browser qualification tools
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/BrowserSmoke/package-lock.json

      - name: Install pinned browser tooling
        run: |
          npm ci --prefix Tools/BrowserSmoke
          cd Tools/BrowserSmoke
          npx playwright install --with-deps chromium

      - name: Install pinned Slang compiler
        shell: bash
        run: |
          mkdir -p "$VALIDATION_ROOT/toolchain/slang"
          curl --fail --location --retry 3 --output "$VALIDATION_ROOT/toolchain/slang.tar.gz" https://github.com/shader-slang/slang/releases/download/v2026.8/slang-2026.8-linux-x86_64.tar.gz
          echo "b23af8f2569e7961ca143c6ecd9abf6d7ac14a9bda739a1c6281694f774fa3eb  $VALIDATION_ROOT/toolchain/slang.tar.gz" | sha256sum --check
          tar -xzf "$VALIDATION_ROOT/toolchain/slang.tar.gz" -C "$VALIDATION_ROOT/toolchain/slang"
          echo "XRE_SLANGC=$GITHUB_WORKSPACE/$VALIDATION_ROOT/toolchain/slang/bin/slangc" >> "$GITHUB_ENV"

      - name: Prepare pinned browser physics sources
        shell: pwsh
        run: |
          ./Tools/Dependencies/Prepare-JoltBrowserManaged.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/managed"
          ./Tools/Dependencies/Build-JoltBrowser.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/native" -DotNetRoot $env:DOTNET_ROOT

      - name: Compile portable projects
        shell: pwsh
        run: ./Tools/Test-PortableBrowserCompile.ps1 -Configuration Release -JoltBrowserManagedSourceDirectory "$env:VALIDATION_ROOT/jolt/managed/staged" -JoltBrowserArchiveDirectory "$env:VALIDATION_ROOT/jolt/native/archives" -ArtifactsPath "$env:VALIDATION_ROOT/portable"

      - name: Publish browser host
        run: dotnet publish XREngine.Browser/XREngine.Browser.csproj -c Release -m:1 --output "$VALIDATION_ROOT/browser" --artifacts-path "$VALIDATION_ROOT/browser-build" -p:WasmBuildNative=true -p:XREngineJoltBrowser=true -p:JoltBrowserManagedSourceDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/managed/staged" -p:JoltBrowserArchiveDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/native/archives"

      - name: Publish native physics lifecycle diagnostic
        run: dotnet publish Tools/Dependencies/JoltBrowser/Spike/JoltBrowserSpike.csproj -c Release -m:1 --output "$VALIDATION_ROOT/jolt-spike" --artifacts-path "$VALIDATION_ROOT/jolt-spike-build" -p:WasmBuildNative=true -p:JoltBrowserManagedSourceDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/managed/staged" -p:JoltBrowserArchiveDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/native/archives"

      - name: Cook engine raster diagnostic shaders
        run: dotnet run --project Tools/ShaderCooker --configuration Release -- --source-root Build/CommonAssets/Shaders/WebGPU/ --recipe Build/CommonAssets/Shaders/WebGPU/engine-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-depth-probe.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-texture-probe.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-shadow-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-tonemap.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-debug-point.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-debug-line.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-debug-triangle.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-depth-normal-prepass.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-gtao-generate.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-gtao-blur-horizontal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-gtao-blur-vertical.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-copy.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-downsample.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-upsample.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-combine.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-ui-quad-batched.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-ui-text-batched-bitmap.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-point-shadow-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-cubemap.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-dynamic-procedural.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-equirectangular.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-gradient.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-octahedral.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-spot-shadow-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-point-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-spot-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture.recipe.json --output "$VALIDATION_ROOT/depth-shaders"

      - name: Cook canonical engine deformation kernel
        run: dotnet run --project Tools/ShaderCooker --configuration Release -- --source-root XREngine.Runtime.Rendering.WebGPU --recipe Build/CommonAssets/Shaders/WebGPU/engine-packed-skinning.recipe.json --output "$VALIDATION_ROOT/compute-shaders"

      - name: Package canonical engine lifecycle world
        run: |
          node Tools/BrowserSmoke/prepare-engine-effects-assets.mjs Tools/BrowserSmoke/Content/engine-assets.recipe.json "$VALIDATION_ROOT/depth-shaders" "$VALIDATION_ROOT/effects-recipe"
          dotnet run --project Tools/BrowserContentCooker --configuration Release -- "$VALIDATION_ROOT/effects-recipe/engine-effects-assets.recipe.json" "$VALIDATION_ROOT/browser/wwwroot/diagnostics/content"

      - name: Verify static browser bundle
        shell: pwsh
        run: |
          $root = "$env:VALIDATION_ROOT/browser/wwwroot"
          foreach ($name in @('index.html', 'engine-player.html', 'engine-runtime.js', 'engine-assets.js')) {
            if (!(Test-Path (Join-Path $root $name))) { throw "Missing browser asset: $name" }
          }
          $nativeLeaves = Get-ChildItem $root -File -Recurse | Where-Object {
            $_.Name -match 'XREngine\.Runtime\.(Bootstrap|Rendering\.(OpenGL|Vulkan)|Platform\.Desktop)'
          }
          if ($nativeLeaves) { throw "Desktop-only assemblies leaked into the browser output: $($nativeLeaves.Name -join ', ')" }

      - name: Qualify browser engine pixels and native physics
        env:
          DEBUG: pw:browser
        run: |
          mkdir -p "$VALIDATION_ROOT/evidence"
          node Tools/BrowserSmoke/run.mjs --browser-publish "$VALIDATION_ROOT/browser/wwwroot" --shader-artifacts "$VALIDATION_ROOT/depth-shaders" --jolt-spike "$VALIDATION_ROOT/jolt-spike/wwwroot" --engine-manifest /diagnostics/content/manifest.json --require-world-play --gpu-mode software --gpu-diagnostics --output "$VALIDATION_ROOT/evidence" > >(tee "$VALIDATION_ROOT/evidence/browser-process-stdout.log") 2> >(tee "$VALIDATION_ROOT/evidence/browser-process-stderr.log" >&2)

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-software-qualification
          path: ${{ env.VALIDATION_ROOT }}/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve browser build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: browser-static-bundle
          path: ${{ env.VALIDATION_ROOT }}/browser/wwwroot
          if-no-files-found: error
          retention-days: 7

  windows-editor-browser:
    name: Publish RollingBall with the Windows Editor CLI
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize pinned Editor project submodules
        shell: pwsh
        run: |
          $paths = @('Build/Submodules/OscCore-NET9', 'Build/Submodules/OpenVR.NET')
          git submodule update --init --checkout -- Build/Submodules/OscCore-NET9 Build/Submodules/OpenVR.NET
          if ($LASTEXITCODE -ne 0) { throw 'The recorded Editor submodules could not be checked out.' }
          foreach ($path in $paths) {
            $entry = (& git ls-tree HEAD -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $entry -notmatch '^160000 commit ([0-9a-f]{40})\s+') {
              throw "No recorded gitlink commit for $path."
            }
            $expected = $Matches[1]
            $actual = (& git -C $path rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
              throw "The $path checkout does not match its recorded gitlink commit."
            }
          }
          foreach ($file in @(
            'Build/Submodules/OscCore-NET9/OscCore.csproj',
            'Build/Submodules/OpenVR.NET/OpenVR.NET/OpenVR.NET.csproj',
            'Build/Submodules/OpenVR.NET/OpenVR.NET/openvr_api.dll')) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing pinned Editor dependency: $file" }
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Prepare pinned browser physics sources
        shell: pwsh
        run: |
          ./Tools/Dependencies/Prepare-JoltBrowserManaged.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/managed"
          ./Tools/Dependencies/Build-JoltBrowser.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/native" -DotNetRoot $env:DOTNET_ROOT

      - name: Stage canonical RollingBall inputs
        shell: pwsh
        run: |
          $source = 'Samples/RollingBall'
          $project = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/project'
          if (Test-Path -LiteralPath $project) { throw 'The CLI validation project must start empty.' }
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          foreach ($name in @('RollingBall.xrproj', 'Assets', 'Config')) {
            $inputPath = Join-Path $source $name
            if (!(Test-Path -LiteralPath $inputPath)) { throw "Missing canonical RollingBall input: $inputPath" }
            Copy-Item -LiteralPath $inputPath -Destination $project -Recurse
          }
          # Metadata is generated by Engine.LoadProject and is absent from a clean checkout.
          Write-Output "Staged canonical RollingBall project: $project"

      - name: Publish RollingBall through the Editor CLI
        shell: pwsh
        env:
          JoltBrowserManagedSourceDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/managed/staged
          JoltBrowserArchiveDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/native/archives
        run: |
          $project = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/project/RollingBall.xrproj'
          $log = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/editor-cli.log'
          dotnet run --project XREngine.Editor/XREngine.Editor.csproj --configuration Release --no-launch-profile -- `
            --build-project $project --build-configuration Release --build-platform BrowserWebGPU `
            --output-subfolder browser-game 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "The Editor browser-publishing CLI failed; inspect $log." }

      - name: Verify activated game bundle and unchanged canonical inputs
        shell: pwsh
        run: |
          $site = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/project/Build/browser-game'
          $descriptorFile = Join-Path $site 'browser-publish.json'
          $manifestFile = Join-Path $site 'content/manifest.json'
          foreach ($file in @((Join-Path $site 'index.html'), $descriptorFile, $manifestFile)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Editor bundle is incomplete: $file" }
          }
          $descriptor = Get-Content -LiteralPath $descriptorFile -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath $manifestFile -Raw | ConvertFrom-Json
          if ($descriptor.schema -ne 2 -or $descriptor.format -ne 'xrengine-engine-launch' -or
              $descriptor.manifest -ne './content/manifest.json' -or
              $manifest.startupWorld -ne '/game/Worlds/RollingBallWorld.asset' -or
              $manifest.assets.Count -lt 32 -or $manifest.shaderArtifacts.Count -lt 15 -or
              $manifest.pipelineArtifacts.Count -lt 9) {
            throw 'The Editor did not activate the canonical RollingBall browser content.'
          }
          git diff --exit-code -- Samples/RollingBall
          if ($LASTEXITCODE -ne 0) { throw 'Canonical RollingBall inputs changed during CLI publishing.' }

      - name: Preserve exact Editor-published game bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-rollingball-bundle
          path: ${{ env.VALIDATION_ROOT }}/rollingball-cli/project/Build/browser-game
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Windows Editor CLI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-rollingball-qualification
          path: |
            ${{ env.VALIDATION_ROOT }}/rollingball-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/rollingball-cli/project/Build/browser-game/browser-publish.json
            ${{ env.VALIDATION_ROOT }}/rollingball-cli/project/Build/browser-game/content/manifest.json
          if-no-files-found: warn
          retention-days: 14

  published-game:
    name: Qualify the Windows Editor bundle in Linux Chromium
    needs: windows-editor-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download exact Editor-published game bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-editor-rollingball-bundle
          path: ${{ env.VALIDATION_ROOT }}/rollingball-game

      - name: Set up browser qualification tools
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/BrowserSmoke/package-lock.json

      - name: Install pinned browser tooling
        run: |
          npm ci --prefix Tools/BrowserSmoke
          cd Tools/BrowserSmoke
          npx playwright install --with-deps chromium

      - name: Qualify the Editor-published game in Chromium
        env:
          DEBUG: pw:browser
        run: |
          mkdir -p "$VALIDATION_ROOT/rollingball-evidence"
          node Tools/BrowserSmoke/run.mjs --game-only --game-publish "$VALIDATION_ROOT/rollingball-game" --gpu-mode software --output "$VALIDATION_ROOT/rollingball-evidence" > >(tee "$VALIDATION_ROOT/rollingball-evidence/browser-process-stdout.log") 2> >(tee "$VALIDATION_ROOT/rollingball-evidence/browser-process-stderr.log" >&2)

      - name: Preserve published game qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-rollingball-browser-qualification
          path: ${{ env.VALIDATION_ROOT }}/rollingball-evidence
          if-no-files-found: warn
          retention-days: 14
