name: Portable browser build and publish

on:
  push:
    branches:
      - master
      - codex/webgpu-readiness-audit
    paths-ignore:
      - '.github/diagnostic-requests/network-walkthrough-20261005.json'
      - '.github/diagnostic-activations/network-walkthrough-20261005.json'
      - '.github/diagnostic-activations/ui-frame-trace-20261006.json'
      - '.github/diagnostic-activations/ui-frame-trace-loaded-20261006.json'
      - 'docs/work/**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-browser-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  MSBUILDDISABLENODEREUSE: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  VALIDATION_ROOT: Build/_AgentValidation/00000000-000000-shared/browser-ci

jobs:
  compile:
    name: Compile portable projects and publish the browser host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Set up browser qualification tools
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/BrowserSmoke/package-lock.json

      - name: Install pinned browser tooling
        run: |
          npm ci --prefix Tools/BrowserSmoke
          cd Tools/BrowserSmoke
          npx playwright install --with-deps chromium

      - name: Inspect installed diagnostic prerequisites without profiling
        run: node Tools/BrowserSmoke/native-profile-prerequisites.mjs "$VALIDATION_ROOT/evidence/native-profile-prerequisites.json"

      - name: Install pinned Slang compiler
        shell: bash
        run: |
          mkdir -p "$VALIDATION_ROOT/toolchain/slang"
          curl --fail --location --retry 3 --output "$VALIDATION_ROOT/toolchain/slang.tar.gz" https://github.com/shader-slang/slang/releases/download/v2026.8/slang-2026.8-linux-x86_64.tar.gz
          echo "b23af8f2569e7961ca143c6ecd9abf6d7ac14a9bda739a1c6281694f774fa3eb  $VALIDATION_ROOT/toolchain/slang.tar.gz" | sha256sum --check
          tar -xzf "$VALIDATION_ROOT/toolchain/slang.tar.gz" -C "$VALIDATION_ROOT/toolchain/slang"
          echo "XRE_SLANGC=$GITHUB_WORKSPACE/$VALIDATION_ROOT/toolchain/slang/bin/slangc" >> "$GITHUB_ENV"

      - name: Prepare pinned browser physics sources
        shell: pwsh
        run: |
          ./Tools/Dependencies/Prepare-JoltBrowserManaged.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/managed"
          ./Tools/Dependencies/Build-JoltBrowser.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/native" -DotNetRoot $env:DOTNET_ROOT

      - name: Compile portable projects
        shell: pwsh
        run: ./Tools/Test-PortableBrowserCompile.ps1 -Configuration Release -JoltBrowserManagedSourceDirectory "$env:VALIDATION_ROOT/jolt/managed/staged" -JoltBrowserArchiveDirectory "$env:VALIDATION_ROOT/jolt/native/archives" -ArtifactsPath "$env:VALIDATION_ROOT/portable"

      - name: Preserve pinned browser physics archives
        uses: actions/upload-artifact@v7
        with:
          name: browser-jolt-native-archives
          path: ${{ env.VALIDATION_ROOT }}/jolt/native/archives
          if-no-files-found: error
          retention-days: 7

      - name: Publish browser host
        run: dotnet publish XREngine.Browser/XREngine.Browser.csproj -c Release -m:1 --output "$VALIDATION_ROOT/browser" --artifacts-path "$VALIDATION_ROOT/browser-build" -p:WasmBuildNative=true -p:XREngineJoltBrowser=true -p:JoltBrowserManagedSourceDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/managed/staged" -p:JoltBrowserArchiveDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/native/archives"

      - name: Verify desktop archive dependency is absent from browser output
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          function* files(root) {
            if (!fs.existsSync(root)) return;
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const child = path.join(root, entry.name);
              if (entry.isDirectory()) yield* files(child);
              else if (entry.isFile()) yield child;
            }
          }

          const validationRoot = path.resolve(process.env.VALIDATION_ROOT);
          const assetRoots = [path.join(validationRoot, 'browser-build'), path.resolve('XREngine.Browser/obj')];
          const graphs = [];
          for (const root of assetRoots) {
            for (const file of files(root)) {
              if (path.basename(file) !== 'project.assets.json') continue;
              const graph = JSON.parse(fs.readFileSync(file, 'utf8'));
              const project = graph.project?.restore?.projectUniqueName?.replaceAll('\\', '/');
              if (project && path.posix.basename(project) === 'XREngine.Browser.csproj')
                graphs.push({ file, graph });
            }
          }
          if (graphs.length === 0) throw new Error('Browser project.assets.json was not found');
          for (const { file, graph } of graphs) {
            if (/sharpziplib/i.test(JSON.stringify(graph)))
              throw new Error(`SharpZipLib is still in the Browser restore graph: ${file}`);
          }

          const published = path.join(validationRoot, 'browser/wwwroot');
          if (!fs.existsSync(published)) throw new Error('Browser publish output was not found');
          const leaked = [...files(published)].filter(file => /sharpziplib/i.test(path.basename(file)));
          if (leaked.length !== 0)
            throw new Error(`SharpZipLib is still in Browser publish output: ${leaked.join(', ')}`);
          console.log(`Verified ${graphs.length} Browser restore graph(s) and published output without SharpZipLib`);
          NODE

      - name: Publish native physics lifecycle diagnostic
        run: dotnet publish Tools/Dependencies/JoltBrowser/Spike/JoltBrowserSpike.csproj -c Release -m:1 --output "$VALIDATION_ROOT/jolt-spike" --artifacts-path "$VALIDATION_ROOT/jolt-spike-build" -p:WasmBuildNative=true -p:JoltBrowserManagedSourceDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/managed/staged" -p:JoltBrowserArchiveDirectory="$GITHUB_WORKSPACE/$VALIDATION_ROOT/jolt/native/archives"

      - name: Cook engine raster diagnostic shaders
        run: dotnet run --project Tools/ShaderCooker --configuration Release -- --source-root Build/CommonAssets/Shaders/WebGPU/ --recipe Build/CommonAssets/Shaders/WebGPU/engine-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-depth-probe.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-texture-probe.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-shadow-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-tonemap.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-debug-point.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-debug-line.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-debug-triangle.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-depth-normal-prepass.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-depth-normal-msaa-resolve.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-gtao-generate.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-gtao-blur-horizontal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-gtao-blur-vertical.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-copy.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-downsample.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-upsample.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-bloom-combine.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-ui-quad-batched.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-ui-text-batched-bitmap.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-point-shadow-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-cubemap.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-dynamic-procedural.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-equirectangular.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-gradient.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-skybox-octahedral.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-spot-shadow-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-point-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-coverage-spot-depth.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-color-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal-directional-shadow.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal-local-shadows.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-standard-lit-texture.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-color.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-texture.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-opaque-texture.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-alpha-texture.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-texture-array-slice.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-color-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-texture-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-opaque-texture-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-alpha-texture-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-unlit-texture-array-slice-depth-normal.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-indirect-cull-primitive.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-meshlets-select-lod.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-authored-rank-sources.recipe.json --recipe Build/CommonAssets/Shaders/WebGPU/engine-authored-mask-ranked-arguments.recipe.json --output "$VALIDATION_ROOT/depth-shaders"

      - name: Cook canonical engine deformation kernel
        run: dotnet run --project Tools/ShaderCooker --configuration Release -- --source-root XREngine.Runtime.Rendering.WebGPU --recipe Build/CommonAssets/Shaders/WebGPU/engine-packed-skinning.recipe.json --output "$VALIDATION_ROOT/compute-shaders"

      - name: Package canonical engine lifecycle world
        run: |
          dotnet build Tools/BrowserRuntimeMetadataCooker/BrowserRuntimeMetadataCooker.csproj -c Release -m:1 --artifacts-path "$VALIDATION_ROOT/portable"
          dotnet "$VALIDATION_ROOT/portable/bin/BrowserRuntimeMetadataCooker/release/BrowserRuntimeMetadataCooker.dll" Tools/BrowserSmoke/Content/EngineSmokeWorld.asset "$VALIDATION_ROOT/metadata-fixture"
          dotnet "$VALIDATION_ROOT/portable/bin/BrowserRuntimeMetadataCooker/release/BrowserRuntimeMetadataCooker.dll" --verify "$VALIDATION_ROOT/metadata-fixture"
          node Tools/BrowserSmoke/prepare-engine-effects-assets.mjs Tools/BrowserSmoke/Content/engine-assets.recipe.json "$VALIDATION_ROOT/depth-shaders" "$VALIDATION_ROOT/metadata-fixture" "$VALIDATION_ROOT/effects-recipe"
          dotnet run --project Tools/BrowserContentCooker --configuration Release -- "$VALIDATION_ROOT/effects-recipe/engine-effects-assets.recipe.json" "$VALIDATION_ROOT/browser/wwwroot/diagnostics/content"

      - name: Verify static browser bundle
        shell: pwsh
        run: |
          $root = "$env:VALIDATION_ROOT/browser/wwwroot"
          foreach ($name in @('index.html', 'engine-player.html', 'engine-runtime.js', 'engine-assets.js')) {
            if (!(Test-Path (Join-Path $root $name))) { throw "Missing browser asset: $name" }
          }
          $nativeLeaves = Get-ChildItem $root -File -Recurse | Where-Object {
            $_.Name -match 'XREngine\.Runtime\.(Bootstrap|Rendering\.(OpenGL|Vulkan)|Platform\.Desktop)'
          }
          if ($nativeLeaves) { throw "Desktop-only assemblies leaked into the browser output: $($nativeLeaves.Name -join ', ')" }

      - name: Qualify browser engine pixels and native physics
        env:
          DEBUG: pw:browser
        run: |
          mkdir -p "$VALIDATION_ROOT/evidence"
          node Tools/BrowserSmoke/run.mjs --browser-publish "$VALIDATION_ROOT/browser/wwwroot" --shader-artifacts "$VALIDATION_ROOT/depth-shaders" --jolt-spike "$VALIDATION_ROOT/jolt-spike/wwwroot" --engine-manifest /diagnostics/content/manifest.json --require-world-play --gpu-mode software --gpu-diagnostics --output "$VALIDATION_ROOT/evidence" > >(tee "$VALIDATION_ROOT/evidence/browser-process-stdout.log") 2> >(tee "$VALIDATION_ROOT/evidence/browser-process-stderr.log" >&2)

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-software-qualification
          path: ${{ env.VALIDATION_ROOT }}/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve browser build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: browser-static-bundle
          path: ${{ env.VALIDATION_ROOT }}/browser/wwwroot
          if-no-files-found: error
          retention-days: 7

  windows-editor-browser:
    name: Publish RollingBall with the Windows Editor CLI
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize pinned Editor project submodules
        shell: pwsh
        run: |
          $paths = @('Build/Submodules/OscCore-NET9', 'Build/Submodules/OpenVR.NET')
          git submodule update --init --checkout -- Build/Submodules/OscCore-NET9 Build/Submodules/OpenVR.NET
          if ($LASTEXITCODE -ne 0) { throw 'The recorded Editor submodules could not be checked out.' }
          foreach ($path in $paths) {
            $entry = (& git ls-tree HEAD -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $entry -notmatch '^160000 commit ([0-9a-f]{40})\s+') {
              throw "No recorded gitlink commit for $path."
            }
            $expected = $Matches[1]
            $actual = (& git -C $path rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
              throw "The $path checkout does not match its recorded gitlink commit."
            }
          }
          foreach ($file in @(
            'Build/Submodules/OscCore-NET9/OscCore.csproj',
            'Build/Submodules/OpenVR.NET/OpenVR.NET/OpenVR.NET.csproj',
            'Build/Submodules/OpenVR.NET/OpenVR.NET/openvr_api.dll')) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing pinned Editor dependency: $file" }
          }

      - name: Stage the pinned Editor shader compiler
        shell: pwsh
        run: |
          $shaderCompiler = 'XREngine.Runtime.Rendering.Vulkan/runtimes/win-x64/native/xr_shaderc.dll'
          $expectedHash = 'f5753bf8c64930c6170f681ce649cc4515468b5b4fc81aa552d0d79a47b42cff'
          $expectedBytes = 5520896
          $pointer = (& git show "HEAD:$shaderCompiler") -join "`n"
          if ($LASTEXITCODE -ne 0 -or $pointer -notmatch "(?m)^oid sha256:$expectedHash$" -or
              $pointer -notmatch "(?m)^size $expectedBytes$") {
            throw 'The Editor shader compiler does not match the reviewed source pin.'
          }
          git lfs pull --include="$shaderCompiler" --exclude=""
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Editor shader compiler could not be fetched.' }
          if ((Get-Item -LiteralPath $shaderCompiler).Length -ne $expectedBytes -or
              (Get-FileHash -LiteralPath $shaderCompiler -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'The staged Editor shader compiler does not match its recorded size and hash.'
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Prepare pinned browser physics sources
        shell: pwsh
        run: |
          ./Tools/Dependencies/Prepare-JoltBrowserManaged.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/managed"
          ./Tools/Dependencies/Build-JoltBrowser.ps1 -OutputDirectory "$env:VALIDATION_ROOT/jolt/native" -DotNetRoot $env:DOTNET_ROOT

      - name: Stage canonical RollingBall inputs
        shell: pwsh
        run: |
          $source = 'Samples/RollingBall'
          $project = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/project'
          if (Test-Path -LiteralPath $project) { throw 'The CLI validation project must start empty.' }
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          foreach ($name in @('RollingBall.xrproj', 'Assets', 'Config')) {
            $inputPath = Join-Path $source $name
            if (!(Test-Path -LiteralPath $inputPath)) { throw "Missing canonical RollingBall input: $inputPath" }
            Copy-Item -LiteralPath $inputPath -Destination $project -Recurse
          }
          # Metadata is generated by Engine.LoadProject and is absent from a clean checkout.
          Write-Output "Staged canonical RollingBall project: $project"

      - name: Publish RollingBall through the Editor CLI
        shell: pwsh
        env:
          JoltBrowserManagedSourceDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/managed/staged
          JoltBrowserArchiveDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/native/archives
        run: |
          $project = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/project/RollingBall.xrproj'
          $log = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/editor-cli.log'
          dotnet run --project XREngine.Editor/XREngine.Editor.csproj --configuration Release --no-launch-profile -- `
            --build-project $project --build-configuration Release --build-platform BrowserWebGPU `
            --output-subfolder browser-game 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "The Editor browser-publishing CLI failed; inspect $log." }

      - name: Verify activated game bundle and unchanged canonical inputs
        shell: pwsh
        run: |
          $site = Join-Path $env:VALIDATION_ROOT 'rollingball-cli/project/Build/browser-game'
          $descriptorFile = Join-Path $site 'browser-publish.json'
          $manifestFile = Join-Path $site 'content/manifest.json'
          foreach ($file in @((Join-Path $site 'index.html'), $descriptorFile, $manifestFile)) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Editor bundle is incomplete: $file" }
          }
          $descriptor = Get-Content -LiteralPath $descriptorFile -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath $manifestFile -Raw | ConvertFrom-Json
          if ($descriptor.schema -ne 2 -or $descriptor.format -ne 'xrengine-engine-launch' -or
              $descriptor.manifest -ne './content/manifest.json' -or
              $manifest.startupWorld -ne '/game/Worlds/RollingBallWorld.asset' -or
              $manifest.assets.Count -lt 32 -or $manifest.shaderArtifacts.Count -lt 15 -or
              $manifest.pipelineArtifacts.Count -lt 9) {
            throw 'The Editor did not activate the canonical RollingBall browser content.'
          }
          git diff --exit-code -- Samples/RollingBall
          if ($LASTEXITCODE -ne 0) { throw 'Canonical RollingBall inputs changed during CLI publishing.' }

      - name: Preserve exact Editor-published game bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-rollingball-bundle
          path: ${{ env.VALIDATION_ROOT }}/rollingball-cli/project/Build/browser-game
          if-no-files-found: error
          retention-days: 7

      - name: Verify dependency attribution in a disposable source copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE "$env:VALIDATION_ROOT/dependency-attribution"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $generatorLog = Join-Path $evidence 'generator.log'
          $reportDiff = Join-Path $evidence 'report-and-licenses.diff'
          $reportStatus = Join-Path $evidence 'report-and-licenses.status.txt'
          $isolated = Join-Path $env:RUNNER_TEMP "xr-dependency-attribution-$([guid]::NewGuid().ToString('N'))"
          $previousLfsSkipSmudge = $env:GIT_LFS_SKIP_SMUDGE
          try {
            $env:GIT_LFS_SKIP_SMUDGE = '1'
            git worktree add --detach $isolated HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the isolated dependency source copy.' }
          }
          finally {
            $env:GIT_LFS_SKIP_SMUDGE = $previousLfsSkipSmudge
          }
          try {
            foreach ($relative in @(
              'XREngine.Data/XREngine.Data.csproj',
              'XREngine.Runtime.Platform.Desktop/XREngine.Runtime.Platform.Desktop.csproj')) {
              $workingHash = (Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $relative) -Algorithm SHA256).Hash
              $isolatedHash = (Get-FileHash -LiteralPath (Join-Path $isolated $relative) -Algorithm SHA256).Hash
              if ($workingHash -ne $isolatedHash) { throw "Isolated source differs from the checked-out project: $relative" }
            }

            & pwsh -NoProfile -File (Join-Path $isolated 'Tools/Reports/Generate-Dependencies.ps1') -NoPromptForUnknownLicenses *> $generatorLog
            if ($LASTEXITCODE -ne 0) { throw 'Isolated dependency report generation failed; inspect generator.log.' }

            $generated = Join-Path $isolated 'docs/DEPENDENCIES.md'
            $rows = @(Select-String -LiteralPath $generated -Pattern '^\| SharpZipLib \|')
            if ($rows.Count -ne 1) { throw 'Expected one SharpZipLib attribution row in the generated report.' }
            $columns = $rows[0].Line.Split('|')
            # Uninitialized submodules may change unrelated report rows in this source copy.
            # Admit only this exact package version, desktop owner and MIT notice.
            if ($columns[2].Trim() -ne '1.4.2' -or
                $columns[5].Trim() -ne 'XREngine.Runtime.Platform.Desktop.csproj') {
              throw "Unexpected SharpZipLib version or direct consumer: $($rows[0].Line)"
            }
            if (!(Test-Path -LiteralPath (Join-Path $isolated 'docs/licenses/nuget/SharpZipLib-1.4.2-MIT.txt') -PathType Leaf)) {
              throw 'The generated SharpZipLib MIT notice is missing.'
            }
          }
          finally {
            try {
              $generated = Join-Path $isolated 'docs/DEPENDENCIES.md'
              if (Test-Path -LiteralPath $generated -PathType Leaf) {
                Copy-Item -LiteralPath $generated -Destination (Join-Path $evidence 'DEPENDENCIES.snapshot.md')
              }
              git -C $isolated diff --binary -- docs/DEPENDENCIES.md docs/licenses > $reportDiff
              git -C $isolated status --short -- docs/DEPENDENCIES.md docs/licenses > $reportStatus
              Write-Output 'Full generated report and unrelated source-copy differences are retained as evidence, not accepted into canonical docs.'
            }
            finally {
              git worktree remove --force $isolated
            }
          }

      - name: Preserve isolated dependency attribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-dependency-attribution
          path: ${{ env.VALIDATION_ROOT }}/dependency-attribution
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare canonical RenderingParity browser inputs
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VALIDATION_ROOT 'toolchain/slang-windows'
          $archive = Join-Path $env:VALIDATION_ROOT 'toolchain/slang-windows.zip'
          New-Item -ItemType Directory -Path (Split-Path -Parent $archive) -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/shader-slang/slang/releases/download/v2026.8/slang-2026.8-windows-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7a3ffcbd267dbddb4818f68ade13da37e2d394dd305c7276fef964933388f184') {
            throw 'The pinned Windows Slang archive hash does not match.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolchain
          $compilers = @(Get-ChildItem -LiteralPath $toolchain -Filter 'slangc.exe' -File -Recurse)
          if ($compilers.Count -ne 1) { throw 'Expected one compiler in the verified Slang archive.' }
          $env:XRE_SLANGC = $compilers[0].FullName
          $project = Join-Path $env:VALIDATION_ROOT 'rendering-parity-cli/project'
          if (Test-Path -LiteralPath $project) { throw 'The RenderingParity CLI project must start empty.' }
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          foreach ($name in @('RenderingParity.xrproj', 'Assets')) {
            Copy-Item -LiteralPath (Join-Path 'Samples/RenderingParity' $name) -Destination $project -Recurse
          }
          New-Item -ItemType Directory -Path (Join-Path $project 'Config') | Out-Null
          ./Tools/Cook-EngineBrowserShaders.ps1 -OutputDirectory (Join-Path $project 'Assets/Shaders/WebGPU')

      - name: Preserve exact native shading cook
        shell: pwsh
        run: |
          $shaders = Join-Path $env:VALIDATION_ROOT 'rendering-parity-cli/project/Assets/Shaders/WebGPU'
          $evidence = Join-Path $env:VALIDATION_ROOT 'advanced-shader-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $catalog = Get-Content -LiteralPath (Join-Path $shaders 'manifest.json') -Raw | ConvertFrom-Json
          $expected = @(
            'engine-advanced-shade-native',
            'engine-advanced-shade-native-depth',
            'engine-advanced-shade-native-msaa',
            'engine-advanced-shade-native-depth-msaa',
            'engine-advanced-shade-surface-exports',
            'engine-advanced-shade-surface-exports-depth',
            'engine-advanced-shade-surface-exports-msaa',
            'engine-advanced-shade-surface-exports-depth-msaa',
            'engine-advanced-shade-uber-native',
            'engine-advanced-shade-uber-native-depth',
            'engine-advanced-shade-uber-native-msaa',
            'engine-advanced-shade-uber-native-depth-msaa',
            'engine-advanced-shade-uber-surface-exports',
            'engine-advanced-shade-uber-surface-exports-depth',
            'engine-advanced-shade-uber-surface-exports-msaa',
            'engine-advanced-shade-uber-surface-exports-depth-msaa',
            'engine-advanced-shade-native-no-modifiers',
            'engine-advanced-shade-native-no-modifiers-msaa',
            'engine-advanced-shade-surface-exports-no-modifiers',
            'engine-advanced-shade-surface-exports-no-modifiers-msaa'
          )
          $selected = @($catalog.artifacts | Where-Object { $_.name -cin $expected })
          $names = @($selected | ForEach-Object { $_.name })
          if ($selected.Count -ne 20 -or @($names | Sort-Object -Unique).Count -ne 20 -or
              @(Compare-Object -ReferenceObject $expected -DifferenceObject $names -CaseSensitive).Count -ne 0) {
            throw 'Expected the exact twenty native shading companions.'
          }
          $descriptors = @{}
          foreach ($entry in $selected) {
            if ($entry.descriptor -ne "$($entry.sha256).shader.json" -or $entry.sha256 -notmatch '^[0-9a-f]{64}$') {
              throw 'Invalid native shading descriptor identity.'
            }
            $descriptorPath = Join-Path $shaders $entry.descriptor
            if ((Get-FileHash -LiteralPath $descriptorPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) {
              throw 'Native shading descriptor bytes changed after cooking.'
            }
            $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
            if ($descriptor.source.sha256 -notmatch '^[0-9a-f]{64}$' -or $descriptor.source.url -ne "$($descriptor.source.sha256).wgsl") {
              throw 'Invalid native shading source identity.'
            }
            $sourcePath = Join-Path $shaders $descriptor.source.url
            if ((Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $descriptor.source.sha256 -or
                (Get-Item -LiteralPath $sourcePath).Length -ne $descriptor.source.byteLength) {
              throw 'Native shading WGSL bytes changed after cooking.'
            }
            Copy-Item -LiteralPath $descriptorPath, $sourcePath -Destination $evidence
            $descriptors[$entry.name] = $descriptor
          }
          foreach ($name in @(
            'engine-advanced-shade-native-no-modifiers',
            'engine-advanced-shade-native-no-modifiers-msaa',
            'engine-advanced-shade-surface-exports-no-modifiers',
            'engine-advanced-shade-surface-exports-no-modifiers-msaa'
          )) {
            $optional = $descriptors[$name]
            $full = $descriptors[$name.Replace('-no-modifiers', '')]
            if ($null -eq $optional -or $null -eq $full -or
                $optional.name -cne $name -or
                $optional.pass -cne $name.Replace('engine-advanced-', '') -or
                $optional.semanticSchemaIdentity -cne 'xrengine.engine.native-unmodified.v1' -or
                $optional.schemaVersion -ne 3 -or $optional.target -cne 'WebGPUWgsl' -or
                $optional.sourceLanguage -cne 'Slang') {
              throw "Invalid optional native shading descriptor: $name"
            }
            $expectedCount = if ($name -ceq 'engine-advanced-shade-native-no-modifiers-msaa') { 40 } else { 41 }
            if ($optional.layout.bindings.Count -ne $expectedCount -or
                (@($optional.workgroupSize) -join ',') -cne '16,16,1' -or
                (@($optional.defines) -join '|') -cne ((@($full.defines) + @('XR_ADV_NATIVE_MODIFIERS_ABSENT_SCHEMA_VERSION=1')) -join '|')) {
              throw "Invalid optional native shading schema or binding count: $name"
            }
            foreach ($field in @('entryPoints', 'workgroupSize', 'layout', 'requiredFeatures',
                'requiredLimits', 'compilerIdentity', 'includes', 'sourceMap', 'pipeline', 'specialization')) {
              if (($optional.$field | ConvertTo-Json -Depth 100 -Compress) -cne
                  ($full.$field | ConvertTo-Json -Depth 100 -Compress)) {
                throw "Optional native shading $field differs from its full program: $name"
              }
            }
            $optionalDependencies = @($optional.dependencies | Where-Object { $_.path -notlike '*.recipe.json' })
            $fullDependencies = @($full.dependencies | Where-Object { $_.path -notlike '*.recipe.json' })
            if (($optionalDependencies | ConvertTo-Json -Depth 100 -Compress) -cne
                ($fullDependencies | ConvertTo-Json -Depth 100 -Compress)) {
              throw "Optional native shading source dependencies differ from its full program: $name"
            }
          }
          $selected | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'artifacts.json') -Encoding utf8NoBOM

