              $pattern = '(?m)(GPURenderDispatchOverride:\r?\n    HasOverride: true\r?\n    Value: )true'
              if ([regex]::Matches($source, $pattern).Count -ne 1) { throw 'The saved GPU override was not unique.' }
              [IO.File]::WriteAllText($startup, ([regex]::new($pattern)).Replace($source, '${1}false', 1))
            }
          }
          $sourceWorld = (Get-FileHash -LiteralPath 'Samples/StaticMeshletParity/Assets/Worlds/StaticMeshletParityWorld.asset' -Algorithm SHA256).Hash
          foreach ($profile in @('gpu', 'cpu')) {
            $stagedWorld = Join-Path $env:VALIDATION_ROOT "static-meshlet-$profile-cli/project/Assets/Worlds/StaticMeshletParityWorld.asset"
            if ((Get-FileHash -LiteralPath $stagedWorld -Algorithm SHA256).Hash -ne $sourceWorld) {
              throw "The staged static meshlet $profile world is not the exact saved source world."
            }
          }

      - name: Publish static meshlet GPU and CPU worlds through the Editor CLI
        shell: pwsh
        env:
          JoltBrowserManagedSourceDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/managed/staged
          JoltBrowserArchiveDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/native/archives
        run: |
          foreach ($profile in @('gpu', 'cpu')) {
            $projectRoot = Join-Path $env:VALIDATION_ROOT "static-meshlet-$profile-cli/project"
            $project = Join-Path $projectRoot 'StaticMeshletParity.xrproj'
            $log = Join-Path $env:VALIDATION_ROOT "static-meshlet-$profile-cli/editor-cli.log"
            dotnet run --project XREngine.Editor/XREngine.Editor.csproj --configuration Release --no-build --no-launch-profile -- `
              --build-project $project --build-configuration Release --build-platform BrowserWebGPU `
              --output-subfolder browser-game 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "The static meshlet $profile Editor CLI publisher failed; inspect $log for BrowserCook.MeshletBackendUnavailable or its inner DLL/export error." }
            $site = Join-Path $projectRoot 'Build/browser-game'
            $manifest = Get-Content -LiteralPath (Join-Path $site 'content/manifest.json') -Raw | ConvertFrom-Json
            if (!(Test-Path -LiteralPath (Join-Path $site 'index.html')) -or
                $manifest.startupWorld -ne '/game/Worlds/StaticMeshletParityWorld.asset' -or
                !($manifest.materialVariants | Where-Object { $_.semantic -eq 'StandardLitTexture' -and $_.semanticVersion -eq 1 })) {
              throw "The Editor did not publish the saved static meshlet $profile world and mapped material."
            }
            foreach ($pass in @('select-lod', 'cull-expand', 'finalize-indexed', 'refit-bounds')) {
              if (!($manifest.pipelineArtifacts | Where-Object { $_.scope -eq 'meshlets' -and $_.pass -eq $pass })) {
                throw "Missing published static meshlet $profile program: $pass"
              }
            }
            $stagedWorld = Join-Path $projectRoot 'Assets/Worlds/StaticMeshletParityWorld.asset'
            if ((Get-FileHash -LiteralPath $stagedWorld -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath 'Samples/StaticMeshletParity/Assets/Worlds/StaticMeshletParityWorld.asset' -Algorithm SHA256).Hash) {
              throw "The static meshlet $profile source world changed during Editor publishing."
            }
          }
          git diff --exit-code -- Samples/StaticMeshletParity
          if ($LASTEXITCODE -ne 0) { throw 'Authored static meshlet sample inputs changed during CLI publishing.' }

      - name: Preserve exact Editor-published static meshlet GPU bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-static-meshlet-parity-bundle
          path: ${{ env.VALIDATION_ROOT }}/static-meshlet-gpu-cli/project/Build/browser-game
          if-no-files-found: error
          retention-days: 7

      - name: Preserve exact Editor-published static meshlet CPU reference
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-static-meshlet-parity-cpu-bundle
          path: ${{ env.VALIDATION_ROOT }}/static-meshlet-cpu-cli/project/Build/browser-game
          if-no-files-found: error
          retention-days: 7

      - name: Publish the shared native networking fixture
        shell: pwsh
        env:
          JoltBrowserManagedSourceDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/managed/staged
          JoltBrowserArchiveDirectory: ${{ github.workspace }}/${{ env.VALIDATION_ROOT }}/jolt/native/archives
        run: |
          $root = Join-Path $env:VALIDATION_ROOT 'network-kinematic-cli'
          $native = Join-Path $root 'native'
          $projectRoot = Join-Path $root 'project'
          if (Test-Path -LiteralPath $root) { throw 'The native networking fixture must start empty.' }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          dotnet run --project XREngine.Server/XREngine.Server.csproj --configuration Release --no-launch-profile -- `
            --create-world-package $native --world-name NetworkKinematicWorld --network-kinematic `
            2>&1 | Tee-Object -FilePath (Join-Path $root 'native-package.log')
          if ($LASTEXITCODE -ne 0) { throw 'The native network world-package generator failed.' }
          $shaders = Join-Path $env:VALIDATION_ROOT 'rendering-parity-cli/project/Assets/Shaders/WebGPU'
          node Tools/BrowserSmoke/prepare-network-kinematic-project.mjs $native $shaders $projectRoot
          if ($LASTEXITCODE -ne 0) { throw 'The native network project staging failed.' }
          dotnet run --project XREngine.Editor/XREngine.Editor.csproj --configuration Release --no-build --no-launch-profile -- `
            --build-project (Join-Path $projectRoot 'NetworkKinematic.xrproj') --build-configuration Release --build-platform BrowserWebGPU `
            --output-subfolder browser-game 2>&1 | Tee-Object -FilePath (Join-Path $root 'editor-cli.log')
          if ($LASTEXITCODE -ne 0) { throw 'The shared native network browser publisher failed.' }
          node Tools/BrowserSmoke/verify-network-kinematic-publication.mjs $native (Join-Path $projectRoot 'Build/browser-game')
          if ($LASTEXITCODE -ne 0) { throw 'The shared native world publication failed canonical identity or byte verification.' }

      - name: Preserve the shared native networking fixture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-network-kinematic-bundle
          path: ${{ env.VALIDATION_ROOT }}/network-kinematic-cli/project/Build/browser-game
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve Windows Editor CLI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-rollingball-qualification
          path: |
            ${{ env.VALIDATION_ROOT }}/rollingball-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/rendering-parity-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/advanced-rendering-parity-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/on/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/off/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/staged-inputs.json
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/postpublish-inputs-on.json
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/postpublish-inputs-off.json
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/published-startup-on.bin
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/published-startup-off.bin
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/startup-verification.json
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/on/project/Assets/Worlds/AdvancedRenderingParityWorld.asset
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/off/project/Assets/Worlds/AdvancedRenderingParityWorld.asset
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/on/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/off/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/on/project/Build/browser-game/shadow-comparison.json
            ${{ env.VALIDATION_ROOT }}/advanced-shadow-parity-cli/off/project/Build/browser-game/shadow-comparison.json
            ${{ env.VALIDATION_ROOT }}/static-meshlet-gpu-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/static-meshlet-cpu-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/network-kinematic-cli/native-package.log
            ${{ env.VALIDATION_ROOT }}/network-kinematic-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/network-kinematic-cli/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/network-kinematic-cli/project/Build/browser-game/content/world-package.json
            ${{ env.VALIDATION_ROOT }}/static-meshlet-gpu-cli/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/static-meshlet-cpu-cli/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/modular-pipeline-parity-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/modular-pipeline-parity-cli/project/Build/browser-game/browser-publish.json
            ${{ env.VALIDATION_ROOT }}/modular-pipeline-parity-cli/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/ui-parity-cli/editor-cli.log
            ${{ env.VALIDATION_ROOT }}/ui-parity-cli/project/Build/browser-game/browser-publish.json
            ${{ env.VALIDATION_ROOT }}/ui-parity-cli/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/advanced-rendering-parity-cli/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/rendering-parity-cli/project/Build/browser-game/browser-publish.json
            ${{ env.VALIDATION_ROOT }}/rendering-parity-cli/project/Build/browser-game/content/manifest.json
            ${{ env.VALIDATION_ROOT }}/rollingball-cli/project/Build/browser-game/browser-publish.json
            ${{ env.VALIDATION_ROOT }}/rollingball-cli/project/Build/browser-game/content/manifest.json
          if-no-files-found: warn
          retention-days: 14

  published-game:
    name: Qualify ${{ matrix.kind }} in Linux Chromium
    needs: windows-editor-browser
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [rollingball, rendering-parity, advanced-rendering-parity, advanced-shadow-parity, ui-parity, modular-pipeline-parity, static-meshlet-parity]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download exact Editor-published game bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-editor-${{ matrix.kind }}-bundle
          path: ${{ env.VALIDATION_ROOT }}/published-game

      - name: Download exact same-world CPU reference
        if: matrix.kind == 'static-meshlet-parity'
        uses: actions/download-artifact@v8
        with:
          name: windows-editor-static-meshlet-parity-cpu-bundle
          path: ${{ env.VALIDATION_ROOT }}/published-cpu-baseline

      - name: Download exact same-world shadow OFF reference
        if: matrix.kind == 'advanced-shadow-parity'
        uses: actions/download-artifact@v8
        with:
          name: windows-editor-advanced-shadow-parity-off-bundle
          path: ${{ env.VALIDATION_ROOT }}/published-cpu-baseline

      - name: Set up browser qualification tools
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tools/BrowserSmoke/package-lock.json

      - name: Install pinned browser tooling
        run: |
          npm ci --prefix Tools/BrowserSmoke
          cd Tools/BrowserSmoke
          npx playwright install --with-deps chromium

      - name: Prepare approved UI frame trace
        id: ui_frame_trace
        if: github.event_name == 'push' && github.repository == 'BlackJaxDev/XRENGINE' && github.ref == 'refs/heads/codex/webgpu-readiness-audit' && github.run_attempt == 1 && matrix.kind == 'ui-parity'
        env:
          GAME_KIND: ${{ matrix.kind }}
          GH_TOKEN: ${{ github.token }}
        run: node Tools/BrowserSmoke/prepare-ui-frame-trace.mjs

      - name: Qualify the Editor-published game in Chromium
        env:
          DEBUG: pw:browser
          GAME_KIND: ${{ matrix.kind }}
        run: |
          mkdir -p "$VALIDATION_ROOT/game-evidence"
          trace_args=()
          if [[ "$GAME_KIND" == "advanced-rendering-parity" ]]; then
            trace_args+=(--native-compile-trace)
          fi
          if [[ "$GAME_KIND" == "static-meshlet-parity" || "$GAME_KIND" == "advanced-shadow-parity" ]]; then
            trace_args+=(--baseline-publish "$VALIDATION_ROOT/published-cpu-baseline")
          fi
          if [[ "${{ steps.ui_frame_trace.outputs.armed }}" == "true" ]]; then
            export DEBUG=''
            trace_args+=(--ui-frame-trace)
          fi
          node Tools/BrowserSmoke/run.mjs --game-only --game-kind "$GAME_KIND" --game-publish "$VALIDATION_ROOT/published-game" --gpu-mode software --output "$VALIDATION_ROOT/game-evidence" "${trace_args[@]}" > >(tee "$VALIDATION_ROOT/game-evidence/browser-process-stdout.log") 2> >(tee "$VALIDATION_ROOT/game-evidence/browser-process-stderr.log" >&2)

      - name: Preserve published game qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-${{ matrix.kind }}-browser-qualification
          path: ${{ env.VALIDATION_ROOT }}/game-evidence
          if-no-files-found: warn
          retention-days: 14
