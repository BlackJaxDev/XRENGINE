name: Portable browser compile

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile every portable project for browser-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Compile portable projects
        shell: pwsh
        run: ./Tools/Test-PortableBrowserCompile.ps1 -Configuration Release
