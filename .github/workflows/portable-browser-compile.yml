          $original = Get-Content -LiteralPath 'Samples/RenderingParity/Assets/Worlds/RenderingParityWorld.asset' -Raw
          $derivative = Get-Content -LiteralPath 'Samples/StaticMeshletParity/Assets/Worlds/StaticMeshletParityWorld.asset' -Raw
          foreach ($pattern in @('(?s)              Mesh:\r?\n.*?(?=              MinProjectedScreenRadiusPixels:)',
              '(?s)                SurfaceTextureBindings:\r?\n.*?(?=                TransmissionColor:)')) {
            $a = [regex]::Match($original, $pattern)
            $b = [regex]::Match($derivative, $pattern)
            if (!$a.Success -or !$b.Success -or $a.Value.Replace("`r", '') -ne $b.Value.Replace("`r", '')) {
              throw 'The static meshlet source changed its original mapped panel geometry or texture bindings.'
