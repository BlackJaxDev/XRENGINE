          foreach ($profile in @('gpu', 'cpu')) {
            $project = Join-Path $env:VALIDATION_ROOT "static-meshlet-$profile-cli/project"
            if (Test-Path -LiteralPath $project) { throw "The static meshlet $profile CLI project must start empty." }
            New-Item -ItemType Directory -Path $project -Force | Out-Null
            foreach ($name in @('StaticMeshletParity.xrproj', 'Assets')) {
              Copy-Item -LiteralPath (Join-Path 'Samples/StaticMeshletParity' $name) -Destination $project -Recurse
            }
            New-Item -ItemType Directory -Path (Join-Path $project 'Config'), (Join-Path $project 'Assets/Shaders') -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $env:VALIDATION_ROOT 'rendering-parity-cli/project/Assets/Shaders/WebGPU') `
              -Destination (Join-Path $project 'Assets/Shaders') -Recurse
            if ($profile -eq 'cpu') {
              $startup = Join-Path $project 'Assets/startup.asset'
