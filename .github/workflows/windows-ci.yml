name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  ALSOFT_DRIVERS: "null"

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      # The SDK goes into a job folder, not Program Files. There the workload restore does not update the
      # runner image's Visual Studio workloads, which the solution does not use, and the cache can keep the folder.
      - name: Restore cached .NET SDK and workloads
        id: dotnet-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\dotnet
          key: dotnet-sdk-workloads-ci-${{ runner.os }}-${{ hashFiles('global.json', 'XRENGINE.slnx') }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          global-json-file: global.json

      - name: Restore pinned .NET workloads
        run: dotnet workload restore XRENGINE.slnx

      - name: Save .NET SDK and workloads
        if: steps.dotnet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\dotnet
          key: ${{ steps.dotnet-cache.outputs.cache-primary-key }}

      - name: Read the Rive submodule commit
        id: rive-commit
        shell: pwsh
        run: |
          $entry = (& git ls-tree HEAD -- Build/Submodules/rive-sharp).Trim()
          if ($LASTEXITCODE -ne 0 -or $entry -notmatch '^160000 commit ([0-9a-f]{40})\s+') {
            throw 'No recorded gitlink commit for Build/Submodules/rive-sharp.'
          }
          "sha=$($Matches[1])" >> $env:GITHUB_OUTPUT

      # Most of the submodule step is the native Rive compile. OpenVR.NET and OscCore are project references,
      # so the solution build compiles them when a cache hit skips this step.
      - name: Restore cached Rive build
        id: rive-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Build/Submodules/rive-sharp/native/bin
            Build/Submodules/rive-sharp/RiveSharp/bin
          key: rive-build-release-${{ runner.os }}-${{ steps.rive-commit.outputs.sha }}-${{ hashFiles('Tools/Build-Submodules.bat', 'Tools/Patches/rive-sharp/**', 'global.json', 'Directory.Build.props', 'Directory.Build.targets') }}

      - name: Build managed and native submodules
        if: steps.rive-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: Tools\Build-Submodules.bat Release AnyCPU

      - name: Save Rive build
        if: steps.rive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Build/Submodules/rive-sharp/native/bin
            Build/Submodules/rive-sharp/RiveSharp/bin
          key: ${{ steps.rive-cache.outputs.cache-primary-key }}

      - name: Stage pinned Streamline runtime and license files
        shell: pwsh
        run: ./Tools/Dependencies/Get-StreamlineSdk.ps1

      - name: Generate unit-testing settings
        shell: pwsh
        run: ./Tools/Generate-UnitTestingWorldSettings.ps1 -Configuration Release

      - name: Restore
        run: dotnet restore XRENGINE.slnx

      - name: Build
        run: dotnet build XRENGINE.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test XREngine.UnitTests/XREngine.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: ./Tools/Reports/Write-TestSummary.ps1 -ResultsDirectory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ci-test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ci-failure-logs
          path: Build/Logs
          if-no-files-found: ignore
