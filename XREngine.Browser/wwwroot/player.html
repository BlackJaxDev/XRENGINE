<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <title>XRENGINE Player</title>
  <script type="module" src="./player.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080d14; color: #e4edf4; font: 16px/1.5 system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #90c9ef; outline-offset: -2px; }
    .shell { position: fixed; left: max(1rem, env(safe-area-inset-left)); right: max(1rem, env(safe-area-inset-right)); bottom: max(1rem, env(safe-area-inset-bottom)); max-width: 40rem; margin: auto; padding: 1rem; border-radius: .5rem; background: #10151ded; box-shadow: 0 4px 24px #0008; }
    .shell[data-state="running"] #status, .shell[data-state="running"] #content-progress { display: none; }
    #status[data-state="failed"] { color: #ffb5b5; }
    #content-progress { margin: .5rem 0 0; color: #b3c2d2; }
    .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: .75rem; }
    button { min-height: 44px; padding: .5rem 1rem; font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="Interactive world">This world requires a browser with WebGPU support.</canvas>
  <div class="shell" id="shell" data-state="loading-runtime">
    <div id="status" role="status" data-state="loading-runtime">Loading the application…</div>
    <div id="content-progress" role="status"></div>
    <div id="audio-status" role="status" hidden></div>
    <div class="actions">
      <button id="enable-audio" type="button" hidden>Enable audio</button>
      <button id="restart" type="button" hidden>Restart</button>
    </div>
  </div>
</body>
</html>
